<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>CounterApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        {{ counterName || 'Moje počítadlo' }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-input
        label="Název počítadla"
        label-placement="stacked"
        fill="outline"
        placeholder="Například návštěvníci"
        [(ngModel)]="counterName"
      ></ion-input>
      <ion-input
        label="Velikost kroku"
        label-placement="stacked"
        fill="outline"
        placeholder="Například 1, 2, 5, 10..."
        type="number"
        min="1"
        [(ngModel)]="step"
      ></ion-input>

      <p class="counter-value">{{ count }}</p>

      <div class="counter-actions">
        <ion-button
          color="danger"
          [disabled]="count === 0"
          (click)="decrementByFive()"
        >
          −5
        </ion-button>

        <ion-button
          color="danger"
          [disabled]="count === 0"
          (click)="decrement()"
        >
          −{{ step }}
        </ion-button>

        <ion-button color="primary" (click)="increment()">
          +{{ step }}
        </ion-button>

        <ion-button color="primary" (click)="incrementByFive()">
          +5
        </ion-button>

        <ion-button
          color="medium"
          fill="outline"
          [disabled]="count === 0"
          (click)="reset()"
        >
          Reset
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
